<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recovery module concept</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm public-health portal; one new section that feels native, not bolted on
   IDEA: a module that lives inside the national portal only between discharge and healing
   PICTURE: the portal page itself, with the recovery section as the hero
   COLOUR and TYPE: white, slate ink, one civic blue; status colours only for status; Figtree
   LAYOUT: story bar on top, portal frame below (nav left, content right), stacks on phones */
:root{color-scheme:light;
--bg:light-dark(#edf1f4,#0f1418);--card:light-dark(#fff,#182027);--ink:light-dark(#14191d,#e8eef3);--mute:light-dark(#5f727c,#9fb0be);
--line:light-dark(#e3e9ed,#2a3540);--brand:light-dark(#2f6b80,#8cc9dc);--brandbg:light-dark(#e9f1f4,#14303a);--on:light-dark(#fff,#0f1418);
--g:light-dark(#24722a,#6fd3a0);--gb:light-dark(#e7f5e8,#12291d);--y:light-dark(#8a5a00,#f2c35b);--yb:light-dark(#fff3d6,#2e230c);--r:light-dark(#e2262f,#ff8a80);--rb:light-dark(#fdeaea,#3a1513);
--teal:light-dark(#1f5a6c,#9fd3e3);--coral:light-dark(#e8686c,#ff9a9d);--avatar:#ee8080;--logo:light-dark(#3f9b45,#6fd37a);--foot:#0e2c37;--link:light-dark(#1678a8,#7cc4f0)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.demo{background:var(--ink);color:var(--bg);padding:12px max(3vw,12px);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.demo b{font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:#ffffff1a;border-radius:12px;padding:4px}
.seg button{border:0;background:none;color:inherit;border-radius:9px;min-height:40px;padding:0 12px;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink)}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}.steps span{padding:4px 10px;border-radius:999px;background:#ffffff1a;white-space:nowrap}.steps span.on{background:var(--brand);color:var(--on);font-weight:700}
.hint{width:100%;font-size:14px;opacity:.85;margin:0}
.portal{max-width:1180px;margin:18px auto 40px;padding:0 max(3vw,10px)}
.frame{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 40px -30px #0b5d8c66}
.phead{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line)}
.word{font-weight:800;font-size:22px;color:var(--brand);letter-spacing:-.5px}.word small{font-size:12px;font-weight:600;color:var(--mute);margin-left:6px;letter-spacing:0}
.user{margin-left:auto;text-align:right;font-size:14px}.user b{display:block}.user span{color:var(--mute);font-size:13px}
.pbody{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:640px}
.pnav{border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.pnav button{border:0;background:none;text-align:left;border-radius:10px;min-height:44px;padding:0 12px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:8px}
.pnav button[aria-current=true]{background:var(--brandbg);color:var(--brand)}
.pnav .new{margin-left:auto;font-size:11px;background:var(--brand);color:var(--on);border-radius:999px;padding:1px 7px}
.main{padding:22px clamp(14px,3vw,30px)}
h1{font-size:clamp(26px,3.4vw,34px);line-height:1.1;margin:0 0 4px;text-wrap:balance}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 8px}
.small{font-size:14px;color:var(--mute)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px;border-bottom:1px solid var(--line)}
.sub button{border:0;background:none;min-height:44px;padding:0 12px;font-weight:600;color:var(--mute);box-shadow:none}
.sub button[aria-current=true]{color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card)}
.card+.card{margin-top:0}
.hero{background:var(--brandbg);border:0}
.status{border-radius:16px;padding:14px 16px;margin:0 0 16px}.status b{display:block;font-size:18px}.status p{margin:2px 0 0;color:var(--ink)}
.st-green{background:var(--gb);color:var(--g)}.st-yellow{background:var(--yb);color:var(--y)}.st-red{background:var(--rb);color:var(--r)}.st-pending,.st-hidden{background:var(--brandbg);color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border:0;border-radius:12px;background:var(--brand);color:var(--on);font-weight:700;padding:0 18px}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.full{width:100%;margin-top:10px}
.btn:disabled,.pill:disabled{opacity:.45;cursor:not-allowed}
.pill{border:0;border-radius:10px;min-height:44px;padding:0 14px;font-weight:700;background:var(--brandbg);color:var(--brand);white-space:nowrap}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.row .t{flex:1}.row .t small{display:block;color:var(--mute);font-size:13px}
.done{color:var(--g);font-weight:700;font-size:14px;white-space:nowrap}.due{color:var(--r)}
.kind{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.k-man{background:var(--rb);color:var(--r)}.k-opt{background:var(--brandbg);color:var(--brand)}
.next{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.next .t{flex:1 1 220px}.next b{font-size:19px;display:block}.next span{font-weight:600;color:var(--brand)}.next.late span{color:var(--r)}
.q{margin:16px 0}.ql{display:block;font-weight:700;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opts button{flex:1 1 100px;min-height:46px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-weight:600;padding:0 10px}
.opts button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on)}
input[type=range]{width:100%;accent-color:var(--brand);height:32px}
input[type=number],input[type=text],input[type=time],select,textarea{font-size:16px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px;min-height:46px;width:100%}
.big{font-size:40px;font-weight:800;text-align:center;line-height:1}
.frameph{position:relative;aspect-ratio:4/3;max-width:420px;border-radius:16px;background:var(--brandbg);overflow:hidden;display:grid;place-items:center;cursor:pointer}
.frameph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.frameph svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.frameph span{position:relative;margin-top:62%;font-weight:600;font-size:14px;color:var(--brand)}
details{border-bottom:1px solid var(--line);padding:10px 0}summary{font-weight:700;cursor:pointer}details p{margin:6px 0 0}
.placeholder{display:grid;place-items:center;min-height:300px;color:var(--mute);text-align:center}
/* clinician */
.dhead{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.prow{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin:8px 0;min-height:60px}
.prow:hover{border-color:var(--brand)}.prow .who b{display:block}.prow .who span{font-size:13px;color:var(--mute)}
.hbar{border-radius:10px;min-height:42px;padding:8px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:#fff;overflow:hidden}
.hbar b{white-space:nowrap}.hbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-red{background:#c62828}.hb-yellow{background:#e0a800;color:#2b1d00}.hb-green{background:#2e7d4f}.hb-pending{background:light-dark(#d5dde4,#33414d);color:var(--ink)}.hb-setup{background:var(--brandbg);color:var(--brand)}.hb-ended{background:light-dark(#e9edf0,#243039);color:var(--mute)}
.ctag{font-size:13px;color:var(--mute);white-space:nowrap}
.bars{position:relative;display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:18px;border-bottom:1px solid var(--line)}
.bars .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:13px;font-weight:700}
.bars .col i{display:block;width:100%;max-width:44px;border-radius:7px 7px 0 0}
.xl{display:flex;gap:8px}.xl span{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.thr{position:absolute;left:0;right:0;border-top:2px dashed #c62828}.thr span{position:absolute;right:0;top:-18px;font-size:12px;color:#c62828;font-weight:700}
.c-red{background:#c62828}.c-yellow{background:#e0a800}.c-green{background:#2e7d4f}.c-pending{background:var(--mute)}
.wph{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.wph figure{margin:0}.wph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}.wph figcaption{font-size:13px;margin-top:4px}
.tag{display:inline-block;border-radius:7px;padding:1px 7px;font-size:12px;font-weight:700;margin:2px 2px 0 0;background:var(--brandbg);color:var(--brand)}.tag.bad{background:#c62828;color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--line)}.dot.on{background:#c62828}
.scroll{overflow-x:auto}
.back{border:0;background:none;color:var(--brand);font-weight:700;min-height:44px;padding:0}
.medrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,.9fr) minmax(0,1.8fr) auto;gap:8px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
.medrow label{font-size:12px;font-weight:700;color:var(--mute);display:block;margin-bottom:3px}
.medrow .sch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;min-height:46px}
.span2{grid-column:1/-1}
.arch{border-left:4px solid var(--brand);padding:8px 12px;margin:10px 0;background:var(--brandbg);border-radius:0 12px 12px 0}
.st-harder{background:light-dark(#fdebd8,#3a2410);color:light-dark(#9a4b00,#f5b27a)}.hb-harder{background:#f3b26f;color:#3d2200}.c-harder{background:#f3b26f}
.sos{border:0;border-radius:10px;background:#c62828;color:#fff;font-weight:800;min-height:40px;padding:0 14px;margin-left:10px}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:8}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.toggle input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--brand)}.toggle small{display:block;color:var(--mute);font-size:13px}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid #0003;vertical-align:-3px;margin-right:6px}
.tl{list-style:none;margin:14px 0 0;padding:0 0 0 26px;position:relative}.tl:before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 18px}.tl li:before{content:'';position:absolute;left:-24px;top:5px;width:10px;height:10px;border-radius:50%;border:2px solid var(--mute);background:var(--card)}
.tl li.appt:before{border-radius:2px;border-color:#2563eb;background:#2563eb}.tl li.done:before{border-color:var(--line);background:var(--line);width:8px;height:8px;left:-23px}
.tl li.today:before{background:var(--ink);border-color:var(--ink);width:12px;height:12px;left:-25px;top:3px}.tl li.today{font-weight:800;font-size:13px;letter-spacing:.3px}
.tl .w{font-size:12px;color:var(--mute)}.tl .ti{font-weight:700}.tl li.done .ti{color:var(--mute);font-weight:600}
.tlf{display:flex;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.tlf button{border:0;background:none;min-height:40px;padding:0;color:var(--mute);font-weight:600}.tlf button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.tlbtn{display:block;border:0;background:none;padding:2px 0;text-align:left;font:inherit;font-weight:700;color:var(--ink);min-height:32px;cursor:pointer}.tlbtn:hover{color:var(--brand)}.tl li.done .tlbtn{color:var(--mute);font-weight:600}
.tl li.logged:before{border-color:var(--g);background:var(--g)}.mem{margin-top:6px}.mem img{width:100%;max-width:320px;border-radius:12px;display:block;margin-bottom:6px}.mem.edit{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.memmini{display:flex;align-items:center;gap:10px;width:100%;max-width:420px;margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px;text-align:left;cursor:pointer}
.memmini img{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none}.memmini>span:not(.chev){flex:1;min-width:0;font-size:13px}.memmini b{display:block;color:var(--g)}.memmini>span>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.memmini .chev{font-size:18px;color:var(--mute);padding:0 6px}.mem.full img{max-width:100%;width:100%}
.ca .opts button{flex:1 1 90px;min-height:46px;border-radius:12px;font-size:15px}
.ca .opts.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}.ca .opts.scale button{min-width:0;padding:0;font-weight:700}
.qh{margin:-4px 0 8px;font-size:13px;color:var(--mute)}.qs{margin:28px 0 6px;font-size:18px;padding-top:14px;border-top:1px solid var(--line)}
.nophoto{aspect-ratio:4/3;border-radius:10px;background:var(--brandbg);display:grid;place-items:center;color:var(--mute);font-size:13px}
.slide{display:flex;align-items:center;gap:14px}.slide input{flex:1;accent-color:var(--brand);height:36px}.slide output{font-size:30px;font-weight:800;min-width:2ch;text-align:right;color:var(--brand)}
.ca .opts.chips button{flex:0 1 auto;padding:0 14px}
.qor{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}.qor button{min-height:40px;border:1.5px solid var(--line);background:var(--card);border-radius:8px;font-weight:700;font-size:14px;padding:0}.qor button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on)}
.qorl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:2px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;z-index:9}.toast.show{opacity:1}
.foot{font-size:12px;color:var(--mute);text-align:center;padding:10px}
@media(max-width:820px){.pbody{grid-template-columns:minmax(0,1fr)}.pnav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.pnav button{flex:none}.grid2{grid-template-columns:minmax(0,1fr)}.prow{grid-template-columns:minmax(0,1fr)}.medrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.medrow .sch{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
/* ===== zVEM look ===== */
body{font-size:17px;line-height:1.45;background:var(--bg)}
.demo{background:#22303a;color:#e8eef2;padding:8px max(3vw,12px);font-size:14px}.seg button{min-height:34px;font-size:13px}.seg button[aria-pressed=true]{background:#fff;color:#22303a}.hint{font-size:13px}

<script>
{
/* ================= CONFIG (placeholders, set by clinicians) ================= */
const CONFIG={thresholds:{yellow:3,red:6},temperature:[{min:39,pts:6},{min:38,pts:3},{min:37.5,pts:1}],painRise:{by:2,pts:2},monitoringDays:42,earlyMinutes:0,remindAgainMin:30,remindOthersMin:60,ackHours:2};
const CHECKIN=[
 {id:'pain',type:'scale',label:'How much pain do you have right now?',weight:v=>v>=8?2:0},
 {id:'chills',label:'Have you had chills or shivering?',opts:[['No',0],['Yes',2]]},
 {id:'urine',label:'Does it burn or hurt when you pee?',opts:[['No',0],['Yes',1]]},
 {id:'bleedSmell',label:'Does your bleeding smell bad?',opts:[['No',0],['Yes',2]]},
 {id:'move',label:'How much were you up and walking today?',opts:[['Barely',1],['A bit',0],['Normally',0]]},
 {id:'toilet',label:'Any problems with bowel movements?',opts:[['No',0],['Yes',1]]},
 {id:'heavyBleed',label:'Are you soaking a pad in an hour or less?',opts:[['No',0],['Yes','RED']]},
 {id:'leg',label:'Is one leg painful, swollen or red?',opts:[['No',0],['Yes','RED']]},
 {id:'breath',label:'Are you short of breath or have chest pain?',opts:[['No',0],['Yes','RED']]},
 {id:'feel',label:'How do you feel about your recovery?',opts:[['Worried',1],['Okay',0],['Confident',0]]},
 {id:'worry',type:'text',label:'Anything worrying you? (optional, goes to your nurse)'}];
const WOUND=[
 {id:'red',label:'Is the skin around the wound red or getting redder?',opts:[['No',0],['Yes',2]]},
 {id:'swell',label:'Is it swollen or warm to touch?',opts:[['No',0],['Yes',1]]},
 {id:'leak',label:'Is anything leaking from it?',opts:[['No',0],['Clear',1],['Pus-like',3]]},
 {id:'open',label:'Has any part of the wound opened?',opts:[['No',0],['Yes',3]]}];
const SHORT={pain:'Severe pain',chills:'Chills',urine:'Burning when peeing',bleedSmell:'Bad-smelling bleeding',move:'Walking',toilet:'Bowel problems',heavyBleed:'Heavy bleeding',leg:'Painful swollen leg',breath:'Short of breath / chest pain',feel:'Feels',red:'Wound red',swell:'Wound swollen/warm',leak:'Wound leaking',open:'Wound opening'};
const MSG={harder:['Harder days','Some answers suggest a harder time. Rest, ask for help, and mention it at your next visit.'],green:['On track today','Everything reported today looks as expected.'],yellow:['Contact your nurse today','Something today needs a closer look. Please call your nurse today.'],red:['Seek help now','Please call 112 or go to the hospital now.'],pending:['Check-in not done yet','Today’s check-in takes about a minute.'],hidden:['Status not shared','Ana hasn’t shared her status with you.']};
const FAQ=[['The skin around my scar feels numb','Numbness around the scar is common and can last for months. Tell your nurse if the area becomes red, hot or painful.'],['My scar is itchy','Itching is usually part of healing. Don’t scratch; keep it clean and dry. Call your nurse if it is red, swollen or leaking.'],['Coughing or laughing hurts','Hold a pillow firmly against your belly. Pain should ease day by day; if it gets worse, check in.'],['When can I take my optional painkiller?','The Medication page shows when the next dose is allowed and counts down to it.']];

const PRESET=[
 {id:'ibu',name:'Ibuprofen',dose:'400 mg',kind:'mandatory',every:8,start:'09:00',strict:true},
 {id:'lmwh',name:'Blood-thinner injection',dose:'1 syringe',kind:'mandatory',every:24,start:'21:00',strict:false},
 {id:'para',name:'Paracetamol',dose:'1 g',kind:'optional',gap:6,max:4}];

/* ================= BABY daily check (placeholders, set by paediatricians) ================= */
const CB={wetMin:6,trendDays:2,feverC:38,youngDays:90,thresholds:{yellow:3,red:6}};
const BQ=[
 {k:'feel',label:'1. How was your baby today overall?',hint:'General wellbeing and behaviour',opts:['Good','Usual','Fussy','Worse than usual']},
 {k:'feedType',label:'2. How was your baby fed today?',opts:['Breastfeeding','Formula','Combined','Solid food']},
 {k:'amount',label:'3. How much did your baby eat today?',hint:'Compared with a usual day. Number of feeds and ml are optional.',opts:['Less than usual','Usual','More than usual'],extra:[['feeds','Number of feeds'],['ml','Total milk (ml), if known']]},
 {k:'feedProb',label:'4. Any problems with feeding?',opts:['No','Refusing feeds','Weak sucking','Tiring during feeds']},
 {k:'sleep',label:'5. How long did your baby sleep today?',hint:'Total in the last 24 hours, an estimate is fine',num:'hours'},
 {k:'wet',label:'6. How many wet diapers?',hint:'In the last 24 hours',num:'diapers'},
 {k:'stool',label:'7. Stools: how many, and what were they like?',opts:['Usual','Soft','Watery','Hard','Changed colour'],extra:[['stoolN','Number of stools']]},
 {k:'sym',label:'8. Any health symptoms?',hint:'Choose all that apply',multi:true,opts:['Fever','Cough','Vomiting','Diarrhoea','Rash','Difficulty breathing','None of these']},
 {k:'change',label:'9. Have you noticed any unusual change?',opts:['No','More sleepy','More crying','Less active','Other']},
 {k:'worry',label:'10. Is anything worrying you about your baby?',opts:['No','Yes, I want to add a note','I want the paediatrician to contact me']}];
const has=(a,v)=>(a.sym||[]).includes(v);
// follow-up questions appear only after certain answers, right under the question that triggered them
const FU=[
 {after:'amount',when:a=>a.amount==='Less than usual',title:'Eating less',qs:[{k:'lessHow',label:'How much less?',opts:['A little less','About half','Much less']},{k:'lessSince',label:'Since when?',opts:['Today','2 days','3 days or more']},{k:'lessRefused',label:'Has your baby refused several feeds?',opts:['No','Yes']}]},
 {after:'wet',when:a=>a.wet!==undefined&&a.wet!==''&&+a.wet<CB.wetMin,title:'Fewer wet diapers',qs:[{k:'wetLast',label:'When was the last wet diaper?',opts:['Under 6 h ago','6–12 h ago','Over 12 h ago']},{k:'wetEatLess',label:'Is your baby also eating less?',opts:['No','Yes']}]},
 {after:'sym',when:a=>has(a,'Fever'),title:'Fever',qs:[{k:'fevT',label:'Temperature (°C)',num:'°C'},{k:'fevHow',label:'How was it measured?',opts:['Rectal','Armpit','Ear','Forehead']}]},
 {after:'sym',when:a=>has(a,'Vomiting'),title:'Vomiting',qs:[{k:'vomN',label:'How many times?',opts:['Once','2–3 times','More than 3']},{k:'vomCol',label:'What colour was it?',opts:['Milky','Yellow','Green','With blood']},{k:'vomForce',label:'Was it forceful (projectile)?',opts:['No','Yes']}]},
 {after:'sym',when:a=>has(a,'Diarrhoea'),title:'Diarrhoea',qs:[{k:'diaN',label:'How many times today?',opts:['1–2','3–5','More than 5']},{k:'diaBlood',label:'Any blood or mucus?',opts:['No','Yes']}]},
 {after:'change',when:a=>a.change==='More sleepy',title:'More sleepy',qs:[{k:'hardWake',label:'Is your baby hard to wake up?',opts:['No','Yes']},{k:'respond',label:'Does your baby respond normally when awake?',opts:['Yes','No']}]},
 {after:'worry',when:a=>a.worry&&a.worry!=='No',title:'Your concern',qs:[{k:'note',label:'What worries you? (optional)',text:true},{k:'wantContact',label:'Should the paediatrician contact you?',opts:['No','Yes'],when:a=>a.worry==='Yes, I want to add a note'}]}];
const PED={name:'Dr. Tadeja Vidmar, paediatrician',phone:'01 234 99 00'};

/* ================= time helpers ================= */
let off=0;const now=()=>new Date(Date.now()+off*6e4);
const pad=n=>String(n).padStart(2,'0');
const dk=(d=now())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addD=n=>{const d=now();d.setDate(d.getDate()+n);return d};
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const at=(day,t)=>{const[y,m,d]=day.split('-').map(Number),[h,mi]=t.split(':').map(Number);return new Date(y,m-1,d,h,mi)};
const dur=ms=>{const m=Math.max(1,Math.round(ms/6e4));return m<60?`${m} min`:`${Math.floor(m/60)} h${m%60?` ${m%60} min`:''}`};
const dayOf=(P,d)=>Math.round((at(d,'12:00')-at(P.surgery,'12:00'))/864e5);
const dayN=P=>dayOf(P,dk());
const fmtD=d=>{const[y,m,dd]=d.split('-');return `${+dd}. ${+m}. ${y}`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)};

/* ================= state ================= */
function freshWait(){return {id:'sara',name:'Sara Bizjak',age:28,procedure:'Caesarean section',phase:'hospital',surgery:dk(addD(-2)),activeFrom:null,plan:{meds:[]},support:{name:'Marko Bizjak',rel:'partner'},medLog:{},optLog:{},checkins:{},temps:{},wounds:{},contacts:{},
  archive:[{procedure:'Laparoscopic cholecystectomy',from:'2022-09-12',to:'2022-09-24',lines:['Monitored 12 days · 1 alert','Wound redness on day 5, settled with local care','Max temperature 37.9 °C']}]}}
const SW=()=>A.waitP;
function freshAna(){return {id:'ana',name:'Ana Kranjc',age:32,procedure:'Caesarean section',phase:'active',surgery:dk(addD(-3)),discharge:dk(),activeFrom:Math.min(at(dk(),'08:00').getTime(),now().getTime()),
  plan:{meds:PRESET.map(m=>({...m}))},waitP:freshWait(),support:{name:'Luka Kranjc',rel:'partner',auth:true,seesStatus:true},
  medLog:{},optLog:{},checkins:{},temps:{},wounds:{},contacts:{},
  baby:{id:'mia',name:'Mia Kranjc',surgery:null,parents:'Ana and Luka Kranjc',checks:{},contacts:{},live:true},
  archive:[{procedure:'Laparoscopic appendectomy',from:'2021-03-02',to:'2021-03-16',lines:['Monitored 14 days · no alerts','Max temperature 37.6 °C','Nausea with tramadol, switched to paracetamol']}]}}
let A=freshAna();A.baby.surgery=A.surgery;const theme0=document.documentElement.getAttribute('data-theme');const _fa=freshAna;
let bDraft={},bResult=null,breathAck=false,pSel=null;
let view='ana',page='home',sub='today',dPage='list',dSel=null,draft={},wDraft={},photo=null,planDraft=null;

/* ================= scoring ================= */
function evalDay(d,P){
  const c=P.checkins[d],t=P.temps[d],w=P.wounds[d],why=[];
  if(!c&&!t&&!w)return{st:'pending',pts:0,why:[]};
  let pts=0,red=false;
  const add=(qs,ans)=>qs.forEach(q=>{if(!ans||ans[q.id]==null)return;
    if(q.type==='scale'){const p=q.weight(ans[q.id]);if(p){pts+=p;why.push([`${SHORT.pain} ${ans[q.id]}/10`,p])}}
    else if(q.opts){const o=q.opts.find(o=>o[0]===ans[q.id]);if(o&&o[1]){if(o[1]==='RED'){red=true;why.push([`Red flag: ${SHORT[q.id]}`,99])}else{pts+=o[1];why.push([SHORT[q.id]+(o[0]==='Yes'?'':`: ${o[0].toLowerCase()}`),o[1]])}}}});
  add(CHECKIN,c);add(WOUND,w&&w.answers);
  if(t){const r=CONFIG.temperature.find(r=>t.v>=r.min);if(r){pts+=r.pts;why.push([`Temperature ${t.v.toFixed(1)} °C`,r.pts+.5])}}
  const y=P.checkins[dk(new Date(at(d,'12:00')-864e5))];
  if(c&&y&&c.pain-y.pain>=CONFIG.painRise.by){pts+=CONFIG.painRise.pts;why.push([`Pain rising ${y.pain}→${c.pain}`,2])}
  const st=(red||pts>=CONFIG.thresholds.red)?'red':pts>=CONFIG.thresholds.yellow?'yellow':c?'green':'pending';
  return{st,pts:red?99:pts,why:why.sort((a,b)=>b[1]-a[1]).map(x=>x[0])};
}

/* ================= medication ================= */
// mandatory: fixed schedule from the time agreed with the patient; strict = late dose moves the next ones
function doses(m,day,P){
  const out=[],n=Math.max(1,Math.round(24/m.every));
  for(let i=0;i<n;i++){
    const planned=new Date(at(day,m.start).getTime()+i*m.every*36e5);
    let due=planned;if(i>0){const p=out[i-1];due=new Date((m.strict&&p.log?p.log.ts:p.due.getTime())+m.every*36e5)}
    const key=`${day}|${m.id}|${i}`;out.push({m,i,due,planned,key,log:P.medLog[key]});
  }
  return out.filter(d=>!P.activeFrom||d.planned>=P.activeFrom||d.log).map((d,i,a)=>({...d,prevOpen:i>0&&!a[i-1].log}));
}
const mand=P=>P.plan.meds.filter(m=>m.kind==='mandatory'), opt=P=>P.plan.meds.filter(m=>m.kind==='optional');
function nextDose(P){
  let all=mand(P).flatMap(m=>doses(m,dk(),P)).filter(d=>!d.log).sort((a,b)=>a.due-b.due);
  if(all.length)return all[0];
  const t=mand(P).flatMap(m=>doses(m,dk(addD(1)),P)).sort((a,b)=>a.due-b.due);return t[0]&&{...t[0],tomorrow:true};
}
const canTake=d=>!d.tomorrow&&!d.prevOpen&&now()>=d.due.getTime()-CONFIG.earlyMinutes*6e4;
function optState(m,P){
  const logs=(P.optLog[m.id]||[]).slice().sort((a,b)=>a.ts-b.ts),last=logs[logs.length-1],today=logs.filter(l=>dk(new Date(l.ts))===dk());
  const nextOk=last?last.ts+m.gap*36e5:0,full=today.length>=m.max;
  return{logs,today,last,nextOk,full,ok:!full&&now()>=nextOk};
}
const who=b=>b==='luka'?A.support.name.split(' ')[0]:'Ana';
/* medicine reminders: anyone on the reminder can mark a dose; only the mother's answer is final */
const confirmed=L=>L&&(L.by==='ana'||L.conf);
const mname=m=>medVis()==='hidden'?`${A.name.split(' ')[0]}’s medicine`:`${esc(m.name)} ${esc(m.dose)}`;
function doseBtn(d,big){
  const cls=big?'btn':'pill';
  if(d.log){const L=d.log,mine=L.by===view,undo=(view==='ana'||mine)?`<button class="pill" data-undo="${d.key}">Undo</button>`:'';
    if(confirmed(L)){const late=L.ts-d.due.getTime();return `<span class="done">✓ Already taken at ${L.at}${L.by!=='ana'?` · marked by ${who(L.by)}, confirmed by Ana`:''}${late>=15*6e4?` <span class="small">(${dur(late)} late)</span>`:''}</span>${view==='ana'?undo:''}`}
    return `<span class="small"><b>Waiting for Ana</b> · marked by ${who(L.by)}, ${L.at}</span>${view==='ana'?`<button class="pill" data-confirm="${d.key}">Confirm</button><button class="pill" data-nottaken="${d.key}">Not taken</button>`:undo}`}
  if(d.prevOpen)return `<button class="${cls}" disabled>After previous dose</button>`;
  if(canTake(d))return `<button class="${cls}" data-take="${d.key}">Taken</button>`;
  return `<button class="${cls}" disabled>Unlocks at ${hm(d.due)}</button>`;

function nextCard(P){

function lastDays(P){const n=Math.max(1,Math.min(dayN(P),7));return [...Array(n).keys()].map(i=>dk(addD(i-n+1)))}
function painChart(P){const days=lastDays(P),val=c=>c?(c.overall??(c.pain!=null?10-c.pain:null)):null;
  return `<div class="card"><h3>Feeling today (0–10)</h3><div class="bars">${days.map(d=>{const v=val(P.checkins[d]);return `<div class="col">${v??'–'}<i class="c-${evalDay(d,P).st}" style="height:${v==null?0:Math.max(4,v*10)}%"></i></div>`}).join('')}</div><div class="xl">${days.map(d=>`<span>D${dayOf(P,d)}</span>`).join('')}</div><p class="small">10 = very good. Bar colour = that day’s status.</p></div>`}
function tempChart(P){const days=lastDays(P),tp=v=>Math.max(0,Math.min(100,(v-36)/4*100));
  return `<div class="card"><h3>Temperature</h3><div class="bars"><div class="thr" style="bottom:${tp(38)}%"><span>38 °C</span></div>${days.map(d=>{const t=P.temps[d];return `<div class="col">${t?t.v.toFixed(1):'–'}<i class="${t?(t.v>=38?'c-red':t.v>=37.5?'c-yellow':'c-green'):''}" style="height:${t?Math.max(4,tp(t.v)):0}%"></i></div>`}).join('')}</div><div class="xl">${days.map(d=>`<span>D${dayOf(P,d)}</span>`).join('')}</div></div>`}
function photos(P){const ph=Object.entries(P.wounds).filter(([,w])=>w.img||w.note||w.looks).sort();
  return ph.length?`<div class="wph">${ph.map(([d,w])=>`<figure>${w.img?`<img src="${w.img}" alt="Wound day ${dayOf(P,d)}">`:'<div class="nophoto">No photo</div>'}<figcaption><b>Day ${dayOf(P,d)}</b><br>${WOUND.map(q=>{const v=w.answers[q.id];return v&&v!=='No'?`<span class="tag bad">${SHORT[q.id]}${v==='Yes'?'':': '+v.toLowerCase()}</span>`:''}).join('')||'<span class="tag">No concerns</span>'}${w.looks?`<br><span class="small">Looks: ${w.looks.join(', ').toLowerCase()} · feels: ${(w.feels||[]).join(', ').toLowerCase()}</span>`:''}${w.note?`<br><span style="font-style:italic">“${esc(w.note)}”</span>`:''}</figcaption></figure>`).join('')}</div>`:'<p class="small">No wound photos or descriptions yet.</p>'}


/* ================= baby: scoring ================= */
function evalBaby(d,B){
  const algT=Object.entries(B.allergens||{}).flatMap(([k,v])=>v.tries.filter(x=>x.date===d&&x.r!=='None').map(x=>({k,r:x.r})));
  const a=B.checks[d]||(algT.length?{}:null),why=[];if(!a)return{st:'pending',pts:0,why,contact:false};
  let pts=0,red=false;const P=(n,t)=>{pts+=n;why.push([t,n])},RED=t=>{red=true;why.push(['Red flag: '+t,99])};
  const age=dayOf(B,d);
  if(a.feel==='Fussy')P(1,'Fussy');if(a.feel==='Worse than usual')P(2,'Worse than usual');
  if(a.amount==='Less than usual'){P(2,'Eating less'+(a.lessHow?`: ${a.lessHow.toLowerCase()}`:''));if(a.lessHow==='Much less')P(1,'Much less food');if(a.lessRefused==='Yes')P(1,'Refused several feeds')}
  if(a.feedProb&&a.feedProb!=='No')P(2,a.feedProb);
  if(a.wet!==''&&a.wet!=null&&+a.wet<CB.wetMin){P(2,`Wet diapers: ${a.wet}`);if(a.wetLast==='Over 12 h ago')RED('no wet diaper for over 12 h');else if(a.wetLast==='6–12 h ago')P(1,'Last wet diaper 6–12 h ago')}
  if(a.stool==='Watery'||a.stool==='Hard')P(1,`Stool ${a.stool.toLowerCase()}`);if(a.stool==='Changed colour')P(2,'Stool changed colour');
  if(a.stoolCol==='Pale, white or grey'||a.stoolCol==='Red / blood')P(3,a.stoolCol==='Red / blood'?'Blood in stool':'Pale, white or grey stool');
  if(a.stoolCol==='Black'&&age>5)P(1,'Black stool after day 5');
  if(has(a,'Cough'))P(1,'Cough');if(has(a,'Rash'))P(1,'Rash');
  if(has(a,'Vomiting')){P(2,'Vomiting'+(a.vomN?` ${a.vomN.toLowerCase()}`:''));if(a.vomCol==='Green'||a.vomCol==='With blood')RED(`vomit ${a.vomCol.toLowerCase()}`);if(a.vomForce==='Yes')P(2,'Forceful vomiting');if(a.vomN==='More than 3')P(1,'Vomiting often')}
  if(has(a,'Diarrhoea')){P(2,'Diarrhoea'+(a.diaN?` ${a.diaN}×`:''));if(a.diaBlood==='Yes')P(2,'Blood or mucus in stool');if(a.diaN==='More than 5')P(1,'Diarrhoea often')}
  if(has(a,'Fever')){const t=parseFloat(String(a.fevT||'').replace(',','.'));
    if(t>=CB.feverC&&age<CB.youngDays)RED(`fever ${t.toFixed(1)} °C at ${age} days old`);else if(t>=CB.feverC)P(3,`Fever ${t.toFixed(1)} °C`);else P(1,'Parent reports fever'+(t?` (${t.toFixed(1)} °C)`:''))}
  if(has(a,'Difficulty breathing'))RED('difficulty breathing');
  if(a.change==='More crying')P(1,'More crying');if(a.change==='Less active')P(2,'Less active');if(a.change==='Other')P(1,'Other change noticed');
  if(a.change==='More sleepy'){P(1,'More sleepy');if(a.hardWake==='Yes')RED('hard to wake');if(a.respond==='No')RED('not responding normally')}
  // trends over several days
  let n=0,w=0;for(let i=0;i<10;i++){const x=B.checks[dk(new Date(at(d,'12:00')-i*864e5))];if(x&&x.amount==='Less than usual')n++;else break}
  for(let i=0;i<10;i++){const x=B.checks[dk(new Date(at(d,'12:00')-i*864e5))];if(x&&x.wet!==''&&+x.wet<CB.wetMin)w++;else break}
  if(n>=CB.trendDays)P(3,`Trend: eating less for ${n} days`);if(w>=CB.trendDays)P(2,`Trend: fewer wet diapers for ${w} days`);
  algT.forEach(x=>{const n=(ALG.find(y=>y[0]===x.k)||[0,x.k])[1];if(x.r==='Serious')RED(`serious reaction to ${n.toLowerCase()}`);else P(3,`Mild reaction to ${n.toLowerCase()}`)});
  const contact=a.worry==='I want the paediatrician to contact me'||a.wantContact==='Yes';
  if(contact)why.push(['Parent asks to be contacted',2.5]);
  let st=(red||pts>=CB.thresholds.red)?'red':pts>=CB.thresholds.yellow?'yellow':'green';if(contact&&st==='green')st='yellow';
  return{st,pts:red?99:pts,why:why.sort((x,y)=>y[1]-x[1]).map(x=>x[0]),contact};
}

function suggestTests(why){const s=new Set(),r=why.join(' | ');
  if(/Temperature|Chills|fever|Fever/.test(r)){s.add('cbc');s.add('crp')}
  if(/(Temperature|Fever) (38\.[5-9]|39|4\d)/.test(r))s.add('bc');
  if(/Wound|wound/.test(r)){s.add('cbc');s.add('crp')}
  if(/pus/i.test(r))s.add('swab');
  if(/Burning when peeing/.test(r))s.add('ua');
  if(/smell/i.test(r)){s.add('cbc');s.add('crp')}
  if(/Heavy bleeding|Pad soaked|Clots/.test(r)){s.add('cbc');s.add('ferr')}
  if(/leg|Short of breath/.test(r))s.add('dd');
  if(/EPDS|mood|screening|frightening/i.test(r))s.add('tsh');
  if(/Red area|lump|Severe pain|Pain rising/.test(r)){s.add('cbc');s.add('crp')}
  if(!s.size){s.add('cbc');s.add('crp')}return [...s]}
